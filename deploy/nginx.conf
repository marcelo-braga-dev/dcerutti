# /etc/nginx/sites-available/dcerutti — depois: certbot --nginx -d SEU_DOMINIO
# Limite por IP nas rotas de conta (login, cadastro, senha, /api/auth): soma ao limite do app.
limit_req_zone $binary_remote_addr zone=dcerutti_conta:10m rate=20r/m;

server {
    listen 80;
    server_name SEU_DOMINIO;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(entrar|cadastro|esqueci-senha|redefinir-senha|api/auth)(/|$) {
        limit_req zone=dcerutti_conta burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
