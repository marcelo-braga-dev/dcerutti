# Banco local de desenvolvimento: MariaDB 10.11, a mesma versão do servidor.
services:
  mysql:
    image: mariadb:10.11
    container_name: dcerutti-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: dcerutti
      MARIADB_USER: dcerutti
      MARIADB_PASSWORD: dcerutti
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
volumes:
  mysql_data:
