# /etc/nginx/sites-available/dcerutti — depois: certbot --nginx -d SEU_DOMINIO
# Limite por IP nas rotas de conta (login, cadastro, senha, /api/auth): soma ao limite do app.
# Só os envios (POST: login, cadastro, senha) contam. Os GET, incluindo os pré-carregamentos que o Next faz dos links
# "Esqueci a senha" e "Criar conta", ficam com chave vazia e não são limitados (sem isso, abrir o login 3-4 vezes dava 429).
map $request_method $dcerutti_conta_chave {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $dcerutti_conta_chave zone=dcerutti_conta_post:10m rate=20r/m;

server {
    listen 80;
    server_name SEU_DOMINIO;

    # Sem cache de proxy: o painel do servidor liga um proxy_cache global, que guardava páginas estáticas do Next de um
    # build antigo (s-maxage de 1 ano) e quebrava o visual depois de cada deploy. O Next cuida do próprio cache.
    proxy_cache off;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(entrar|cadastro|esqueci-senha|redefinir-senha|api/auth)(/|$) {
        limit_req zone=dcerutti_conta_post burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vídeos de produto (D-29): até 100 MB, passados ao app em partes (sem juntar no disco do Nginx antes).
    location = /api/upload/video {
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
